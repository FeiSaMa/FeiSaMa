<svg xmlns="http://www.w3.org/2000/svg" width="10" height="28" viewBox="0 0 10 28" role="img" aria-hidden="true">
  <style>
    rect { fill: #8b949e; animation: blink 1.1s steps(1, end) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { rect { animation: none; opacity: 1; } }
  </style>
  <rect x="0" y="3" width="9" height="20" rx="1.5"/>
</svg>
